<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 220" role="img" aria-label="What happens when an instance boots, and how a new AMI or app version rolls through the fleet." xmlns="http://www.w3.org/2000/svg" width="1100" height="220"><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .d-text{fill:#151a22} .d-muted{fill:#5d6878} .d-mono{fill:#3c4656;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .d-edge{fill:#3c4656;font-weight:600} .d-labelbg{fill:#ffffff} .d-line{stroke:#3c4656} .d-arrowhead{fill:#3c4656} .d-arrowhead-accent{fill:#E8590C} .d-box{fill:#ffffff;stroke:#d5dbe3} .d-note{fill:#eef1f5;stroke:#d5dbe3} .d-abbr{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.02em}</style><rect x="0" y="0" width="1100" height="220" rx="10" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead-accent"/></marker><marker id="as-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead-accent"/></marker></defs><rect x="20" y="50" width="160" height="74" rx="6" class="d-box" stroke-width="1.4"/>
<text x="100.0" y="68" font-size="12" text-anchor="middle" font-weight="700" class="d-text">1. Launch</text>
<text x="100.0" y="84" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">ASG launches from the</text>
<text x="100.0" y="98" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">latest launch template</text>
<polyline points="180,87 202,87" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="202" y="50" width="160" height="74" rx="6" class="d-box" stroke-width="1.4"/>
<text x="282.0" y="68" font-size="12" text-anchor="middle" font-weight="700" class="d-text">2. Fetch release</text>
<text x="282.0" y="84" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">S3 app.jar + .sha256</text>
<text x="282.0" y="98" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">sha256sum --check</text>
<polyline points="362,87 384,87" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="384" y="50" width="160" height="74" rx="6" class="d-box" stroke-width="1.4"/>
<text x="464.0" y="68" font-size="12" text-anchor="middle" font-weight="700" class="d-text">3. Mount EFS</text>
<text x="464.0" y="84" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">tls, iam, accesspoint</text>
<text x="464.0" y="98" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">→ /mnt/data</text>
<polyline points="544,87 566,87" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="566" y="50" width="160" height="74" rx="6" class="d-box" stroke-width="1.4"/>
<text x="646.0" y="68" font-size="12" text-anchor="middle" font-weight="700" class="d-text">4. Configure</text>
<text x="646.0" y="84" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">/etc/java-app/app.env</text>
<text x="646.0" y="98" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">(DB host, secret ARN)</text>
<polyline points="726,87 748,87" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="748" y="50" width="160" height="74" rx="6" class="d-box" stroke-width="1.4"/>
<text x="828.0" y="68" font-size="12" text-anchor="middle" font-weight="700" class="d-text">5. Start</text>
<text x="828.0" y="84" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">java-app.service</text>
<text x="828.0" y="98" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">CloudWatch agent</text>
<polyline points="908,87 930,87" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="930" y="50" width="160" height="74" rx="6" stroke="#E8590C" fill="#E8590C" fill-opacity="0.08" stroke-width="1.4"/>
<text x="1010.0" y="68" font-size="12" text-anchor="middle" font-weight="700" class="d-text">6. InService</text>
<text x="1010.0" y="84" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">ALB GET /health = 200</text>
<text x="1010.0" y="98" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">2 checks × 15 s</text>
<text x="20" y="28" font-size="11" text-anchor="start" font-weight="400" class="d-muted">user_data.sh.tftpl runs once per instance; a failure leaves the instance unhealthy and the ASG replaces it.</text>
<rect x="20" y="150" width="520" height="58" rx="6" class="d-box" stroke-width="1.4"/>
<text x="280.0" y="168" font-size="12" text-anchor="middle" font-weight="700" class="d-text">Rolling instance refresh</text>
<text x="280.0" y="184" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">triggered by a new launch-template version (new AMI or app_version)</text>
<text x="280.0" y="198" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">min healthy 100 %, max 200 %: new instance must pass before an old one leaves</text>
<rect x="560" y="150" width="520" height="58" rx="6" class="d-box" stroke-width="1.4"/>
<text x="820.0" y="168" font-size="12" text-anchor="middle" font-weight="700" class="d-text">Auto-rollback</text>
<text x="820.0" y="184" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">if replacement instances never become healthy,</text>
<text x="820.0" y="198" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">the ASG returns to the previous launch-template version</text></svg>
