<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1180 250" role="img" aria-label="A request&#x27;s path: Route 53 resolves to the ALB, the ALB terminates TLS and forwards to the app on 8080; the app reaches RDS, EFS and Secrets Manager, each allowed by exactly one security-group rule." xmlns="http://www.w3.org/2000/svg" width="1180" height="250"><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .d-text{fill:#151a22} .d-muted{fill:#5d6878} .d-mono{fill:#3c4656;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .d-edge{fill:#3c4656;font-weight:600} .d-labelbg{fill:#ffffff} .d-line{stroke:#3c4656} .d-arrowhead{fill:#3c4656} .d-arrowhead-accent{fill:#E8590C} .d-box{fill:#ffffff;stroke:#d5dbe3} .d-note{fill:#eef1f5;stroke:#d5dbe3} .d-abbr{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.02em}</style><rect x="0" y="0" width="1180" height="250" rx="10" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead-accent"/></marker><marker id="as-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead-accent"/></marker></defs><rect x="30" y="70" width="44" height="44" rx="8" fill="#5A6B86"/>
<text x="52.0" y="96.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">Users</text>
<text x="52.0" y="128" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">browser / curl</text>
<rect x="190" y="70" width="44" height="44" rx="8" fill="#8C4FFF"/>
<text x="212.0" y="96.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">R53</text>
<text x="212.0" y="128" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">Route 53</text>
<text x="212.0" y="141" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">alias A record</text>
<rect x="360" y="70" width="44" height="44" rx="8" fill="#8C4FFF"/>
<text x="382.0" y="96.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">ALB</text>
<text x="382.0" y="128" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">ALB + WAF</text>
<text x="382.0" y="141" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">TLS 1.3/1.2</text>
<rect x="560" y="70" width="44" height="44" rx="8" fill="#ED7100"/>
<text x="582.0" y="96.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">EC2</text>
<text x="582.0" y="128" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">java-app :8080</text>
<text x="582.0" y="141" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">systemd, non-root</text>
<rect x="820" y="10" width="44" height="44" rx="8" fill="#C925D1"/>
<text x="842.0" y="36.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">RDS</text>
<text x="842.0" y="68" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">MySQL 8.4</text>
<text x="842.0" y="81" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">require_secure_transport</text>
<rect x="820" y="95" width="44" height="44" rx="8" fill="#7AA116"/>
<text x="842.0" y="121.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">EFS</text>
<text x="842.0" y="153" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">access point /app</text>
<text x="842.0" y="166" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">TLS + IAM</text>
<rect x="820" y="180" width="44" height="44" rx="8" fill="#DD344C"/>
<text x="842.0" y="206.0" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff" class="d-abbr">SM</text>
<text x="842.0" y="238" font-size="11.5" text-anchor="middle" font-weight="600" class="d-text">Secrets Manager</text>
<text x="842.0" y="251" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">via VPC endpoint</text>
<polyline points="76,92 188,92" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="105.6" y="75" width="52.800000000000004" height="16" rx="3" class="d-labelbg"/>
<text x="132" y="86" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">resolve</text>
<polyline points="236,92 358,92" fill="none" stroke="#E8590C" stroke-width="1.6" marker-end="url(#ah-accent)"/>
<rect x="261.0" y="75" width="72.0" height="16" rx="3" class="d-labelbg"/>
<text x="297" y="86" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">HTTPS :443</text>
<polyline points="406,92 558,92" fill="none" stroke="#E8590C" stroke-width="1.6" marker-end="url(#ah-accent)"/>
<rect x="446.0" y="75" width="72.0" height="16" rx="3" class="d-labelbg"/>
<text x="482" y="86" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">HTTP :8080</text>
<polyline points="606,86 818,32" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="692.0" y="41" width="40.0" height="16" rx="3" class="d-labelbg"/>
<text x="712" y="52" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">:3306</text>
<polyline points="606,92 818,117" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="692.0" y="89" width="40.0" height="16" rx="3" class="d-labelbg"/>
<text x="712" y="100" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">:2049</text>
<polyline points="606,100 818,202" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="695.2" y="151" width="33.6" height="16" rx="3" class="d-labelbg"/>
<text x="712" y="162" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">:443</text>
<text x="383" y="168" font-size="10.5" text-anchor="middle" font-weight="400" class="d-mono">sg alb: 80/443 from 0.0.0.0/0</text>
<text x="583" y="168" font-size="10.5" text-anchor="middle" font-weight="400" class="d-mono">sg app: 8080 from sg alb only</text>
<text x="1020" y="32" font-size="10.5" text-anchor="start" font-weight="400" class="d-mono">sg db: 3306 from sg app</text>
<text x="1020" y="117" font-size="10.5" text-anchor="start" font-weight="400" class="d-mono">sg efs: 2049 from sg app</text>
<text x="1020" y="202" font-size="10.5" text-anchor="start" font-weight="400" class="d-mono">sg vpce: 443 from VPC CIDR</text>
<polyline points="383,175 383,200" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="383" y="218" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">HTTP :80 → 301 to HTTPS</text></svg>
