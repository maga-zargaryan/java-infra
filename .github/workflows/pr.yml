name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Format
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate
        run: |
          for root in terraform/environments/dev terraform/environments/prod; do
            terraform -chdir="$root" init -backend=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

      - name: Lint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Plans need the infrastructure they read to exist; docs-only changes don't.
      - name: Detect infrastructure changes
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^terraform/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No infrastructure changes; plan skipped"
          fi

  plan:
    name: plan (${{ matrix.stack }})
    needs: [static, changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: dev
            directory: terraform/environments/dev
            environment: development-plan
          - stack: prod
            directory: terraform/environments/prod
            environment: production-plan
    environment: ${{ matrix.environment }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Production disabled
        if: matrix.stack == 'prod' && vars.PRODUCTION_ENABLED != 'true'
        run: echo "::notice::Production plan skipped (PRODUCTION_ENABLED is not true)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.stack != 'prod' || vars.PRODUCTION_ENABLED == 'true'

      - uses: ./.github/actions/terraform
        if: matrix.stack != 'prod' || vars.PRODUCTION_ENABLED == 'true'
        with:
          working-directory: ${{ matrix.directory }}
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Plan
        if: matrix.stack != 'prod' || vars.PRODUCTION_ENABLED == 'true'
        working-directory: ${{ matrix.directory }}
        run: |
          set -o pipefail
          terraform plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
          {
            echo "### Plan: ${{ matrix.stack }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # Single required status check for branch protection.
  ci:
    name: ci
    needs: [static, changes, plan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all checks to pass
        env:
          STATIC: ${{ needs.static.result }}
          CHANGES: ${{ needs.changes.result }}
          PLAN: ${{ needs.plan.result }}
          INFRA: ${{ needs.changes.outputs.infra }}
        run: |
          [[ "$STATIC" == "success" && "$CHANGES" == "success" ]] || exit 1
          # The plan may only be skipped when no infrastructure changed.
          [[ "$PLAN" == "success" || ( "$PLAN" == "skipped" && "$INFRA" == "false" ) ]]
