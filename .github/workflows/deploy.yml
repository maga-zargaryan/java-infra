name: Deploy

# dev → prod plan → (approval) → prod apply, all from the same commit.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  dev:
    name: apply (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: development
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform
        with:
          working-directory: terraform/environments/dev
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply
        working-directory: terraform/environments/dev
        run: terraform apply -lock-timeout=5m -auto-approve

  prod-plan:
    name: plan (prod)
    needs: dev
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-plan
    env:
      PLAN_URI: s3://${{ vars.TF_PLAN_BUCKET }}/${{ github.event.repository.name }}/prod/${{ github.run_id }}/tfplan
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform
        with:
          working-directory: terraform/environments/prod
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      - name: Plan
        working-directory: terraform/environments/prod
        run: |
          terraform plan -lock-timeout=5m -no-color -out=tfplan
          {
            echo "### Production plan (awaiting approval)"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Reviewed plans hold state values: they go to a private bucket that only the
      # prod plan and apply roles can reach, never to (public) workflow artifacts.
      - name: Store plan for the apply job
        working-directory: terraform/environments/prod
        run: aws s3 cp tfplan "$PLAN_URI" --only-show-errors

  prod-apply:
    name: apply (prod)
    needs: prod-plan
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      PLAN_URI: s3://${{ vars.TF_PLAN_BUCKET }}/${{ github.event.repository.name }}/prod/${{ github.run_id }}/tfplan
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform
        with:
          working-directory: terraform/environments/prod
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      - name: Fetch reviewed plan
        working-directory: terraform/environments/prod
        run: aws s3 cp "$PLAN_URI" tfplan --only-show-errors
      - name: Apply reviewed plan
        working-directory: terraform/environments/prod
        run: terraform apply -lock-timeout=5m tfplan
      - name: Delete stored plan
        if: always()
        run: aws s3 rm "$PLAN_URI" --only-show-errors
