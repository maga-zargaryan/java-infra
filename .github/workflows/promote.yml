name: Promote

# Opens a pull request that pins prod to the exact AMI dev runs. Merging it runs
# Deploy; prod still waits for the production approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: promote dev to prod
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The release GitHub App opens the pull request: pull requests opened with the
      # built-in token would not trigger the required ci check.
      - name: Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Open the promotion pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          read_ami() { sed -nE 's/^ami_id *= *"([^"]*)"/\1/p' "terraform/environments/$1/terraform.tfvars"; }
          DEV=$(read_ami dev)
          PROD=$(read_ami prod)
          if [[ ! "$DEV" =~ ^ami-[0-9a-f]{8,17}$ ]]; then
            echo "::error::dev has no valid ami_id ($DEV)"; exit 1
          fi
          if [[ "$DEV" == "$PROD" ]]; then
            echo "::notice::prod already runs $DEV"; exit 0
          fi
          BRANCH="promote/prod-$DEV"
          git switch -c "$BRANCH"
          sed -i -E "s/^(ami_id *= *)\"[^\"]*\"/\1\"$DEV\"/" terraform/environments/prod/terraform.tfvars
          git -c user.name="java-platform-release[bot]" -c user.email="java-platform-release[bot]@users.noreply.github.com" \
            commit -qam "Promote $DEV from dev to prod"
          git push --quiet origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "Promote $DEV to prod" \
            --body "Pins prod to \`$DEV\`, the AMI dev runs (previously \`$PROD\`). Merging runs Deploy; prod waits for the production approval."
