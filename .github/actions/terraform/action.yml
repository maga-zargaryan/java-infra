name: Terraform setup
description: Install Terraform, assume the environment's AWS role through OIDC and initialise the backend.

inputs:
  working-directory:
    description: Terraform root module.
    required: true
  role-arn:
    description: IAM role to assume.
    required: true
  aws-region:
    description: AWS region.
    required: true
  terraform-version:
    description: Terraform version.
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false -lockfile=readonly
